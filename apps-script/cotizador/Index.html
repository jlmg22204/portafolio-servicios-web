<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f1f5f4; color: #1f2937; margin: 0; padding: 16px; }
    .card { max-width: 640px; margin: 0 auto; background: #fff; border-radius: 14px; padding: 22px; box-shadow: 0 10px 30px rgba(0,0,0,.06); }
    h1 { font-size: 20px; margin: 0 0 4px; } p.s { color: #6b7280; margin: 0 0 18px; font-size: 14px; }
    label { display: block; font-size: 13px; font-weight: bold; margin: 10px 0 4px; }
    input { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .prod { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
    .prod input { width: 70px; text-align: center; }
    .tot { text-align: right; font-size: 18px; font-weight: bold; margin: 14px 0; }
    button { width: 100%; background: #0f9d58; color: #fff; border: 0; border-radius: 10px; padding: 14px; font-size: 15px; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: .5; }
    .msg { margin-top: 12px; font-size: 14px; } .ok { color: #0f9d58; } .err { color: #dc2626; }
    @media (max-width: 520px) { .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="card">
    <h1>Solicita tu cotización</h1>
    <p class="s">Te llegará en PDF a tu correo en segundos.</p>
    <form id="f">
      <label>Nombre o razón social</label><input name="cliente" required>
      <div class="row">
        <div><label>DNI o RUC</label><input name="documento" required inputmode="numeric" pattern="\d{8}|\d{11}"></div>
        <div><label>Teléfono</label><input name="telefono" inputmode="tel"></div>
      </div>
      <label>Correo</label><input name="correo" type="email" required>
      <label>Productos</label>
      <div id="productos">Cargando productos…</div>
      <div class="tot" id="tot">Total: S/ 0.00</div>
      <button id="btn">Enviar cotización a mi correo</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>
  <script>
    let productos = [];
    const soles = (n) => 'S/ ' + n.toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const total = () => productos.reduce((s, p) => s + p.precio * (+document.querySelector(`[data-c="${p.codigo}"]`).value || 0), 0);
    google.script.run.withSuccessHandler((lista) => {
      productos = lista;
      document.getElementById('productos').innerHTML = lista.map((p) =>
        `<div class="prod"><span>${p.nombre}<br><small style="color:#6b7280">${soles(p.precio)}</small></span>
         <input type="number" min="0" step="1" value="0" data-c="${p.codigo}"></div>`).join('');
    }).getProductos();
    document.addEventListener('input', () => { document.getElementById('tot').textContent = 'Total: ' + soles(total()); });
    document.getElementById('f').addEventListener('submit', (e) => {
      e.preventDefault();
      const fd = new FormData(e.target), btn = document.getElementById('btn'), msg = document.getElementById('msg');
      const datos = Object.fromEntries(['cliente', 'documento', 'telefono', 'correo'].map((k) => [k, fd.get(k)]));
      datos.items = productos.map((p) => ({ codigo: p.codigo, cantidad: +document.querySelector(`[data-c="${p.codigo}"]`).value || 0 }));
      btn.disabled = true; msg.className = 'msg'; msg.textContent = 'Generando tu cotización…';
      google.script.run
        .withSuccessHandler((r) => { msg.className = 'msg ok'; msg.textContent = `✓ Cotización ${r.numero} enviada a ${datos.correo} (${soles(r.total)}).`; e.target.reset(); btn.disabled = false; })
        .withFailureHandler((err) => { msg.className = 'msg err'; msg.textContent = '✗ ' + err.message; btn.disabled = false; })
        .crearCotizacion(datos);
    });
  </script>
</body>
</html>
